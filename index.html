<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    width: 100%; height: 100%;

    -webkit-font-smoothing: antialiased;
  }

  /* React overlay: container is click-through, children opt-in */

    position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
  }

  /* ── MapLibre overrides ── */
  .maplibregl-map { background: #f7f9f4; }

  .maplibregl-canvas { cursor: crosshair !important; }
  .maplibregl-ctrl-bottom-right { bottom: 2.2rem !important; right: 2rem !important; }
  .maplibregl-ctrl-attrib {
    font-family: "Cormorant Garamond", serif !important;
    font-size: 0.5rem !important;
    background: rgba(247,249,244,0.82) !important;
    border: none !important;
    letter-spacing: 0.06em !important;
    color: #8aaa8a !important;
    border-radius: 0 !important;

  .maplibregl-ctrl-attrib a { color: #6a9a6a !important; }
  .maplibregl-ctrl-logo { display: none !important; }

  /* ── Personal clover marker — canvas-based, matches eco layer ── */
  .clover-dot {
    position: relative;
    width: 26px; height: 26px;
    pointer-events: all;
    cursor: pointer;
    transition: transform 0.24s cubic-bezier(.22,1,.36,1),
                filter  0.24s ease;
  }
  .clover-dot canvas {
    display: block;
    filter: drop-shadow(0 1px 3px rgba(40,90,28,0.18));
  }
  .clover-dot:hover {
    transform: scale(1.42);
  }
  .clover-dot--fresh {
    animation: cdot-appear 0.55s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes cdot-appear {
    0%   { transform: scale(0.1) rotate(-10deg); opacity: 0; }
    70%  { transform: scale(1.12) rotate(3deg);  opacity: 1; }
    100% { transform: scale(1)    rotate(0deg);  opacity: 1; }
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .anim-fade-up  { animation: fadeUp  0.9s cubic-bezier(.22,1,.36,1) forwards; }
  .anim-modal-in { animation: modalIn 0.38s cubic-bezier(.22,1,.36,1) forwards; }

  /* ── Map wrapper ── */
  #map-wrap {
    position: fixed; inset: 0; z-index: 1;
  }
  #map { position: absolute !important; inset: 0; z-index: auto !important; }

  input, textarea {
    -webkit-user-select: text;
    user-select: text;
    -webkit-appearance: none;
  }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(80,140,80,0.2); }

  /* ── Ecological archive badge ── */
  #eco-badge {
    position: fixed;
    bottom: 4.6rem;
    left: 2rem;
    z-index: 8;
    pointer-events: none;
    font-family: "Cormorant Garamond", serif;
    font-size: 0.52rem;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: rgba(72,128,58,0.48);
    line-height: 1.75;
  }
  #eco-badge span {
    display: block;
  }

  /* ── Data import button ── */
  #data-import {
    position: fixed;
    bottom: 10.2rem;
    left: 2rem;
    z-index: 12;
    pointer-events: all;
    font-family: "Cormorant Garamond", serif;
    font-size: 0.56rem;
    letter-spacing: 0.16em;

    padding: 0.38rem 0.85rem;
    cursor: pointer;
    transition: all 0.22s;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    user-select: none;
    white-space: nowrap;

    color: rgba(40,100,30,0.82);
    border-color: rgba(72,128,58,0.45);
    background: rgba(251,253,249,0.96);
  }

    color: rgba(40,100,30,0.75);
    border-color: rgba(72,128,58,0.42);

    position: fixed;
    bottom: 7.2rem;
    left: 2rem;
    z-index: 12;
    pointer-events: all;
    font-family: "Cormorant Garamond", serif;

const map = new maplibregl.Map({
  container: 'map',
  style:      MAP_STYLE,
  center:     [12, 22],
  zoom:       1.72,
  minZoom:    0.5,
  maxZoom:    18,
  renderWorldCopies: false,
  attributionControl: false,
  pitchWithRotate: false,
  dragRotate: false,
});

map.addControl(
  new maplibregl.AttributionControl({ compact: true }),
  'bottom-right'
);

window.mapInstance = map;

window.mapReady = new Promise(resolve => {
  if (map.isStyleLoaded()) resolve();
  else map.once('load', resolve);
});

let _skipNextMapClick = false;
window.suppressNextMapClick = () => {
  _skipNextMapClick = true;
  setTimeout(() => { _skipNextMapClick = false; }, 180);
};

map.on('click', e => {
  if (_skipNextMapClick) return;
  if (window.onMapClick) window.onMapClick(e.lngLat.lng, e.lngLat.lat);
});
</script>

function toGBIF_FC(features) {
  return {
    type: 'FeatureCollection',
    features: (features || [])
      .filter(f => {
        const c = f?.geometry?.coordinates;
        return c && isValidOccurrence(c[0], c[1]);
      })
      .map(f => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: f.geometry.coordinates },
        properties: {
          intensity: 0.7,
          species: f.properties?.species || f.properties?.scientificName || 'Marsilea quadrifolia'
        }
      }))
  };
}

const FALLBACK_FC = {
  type: 'FeatureCollection',
  features: GBIF_RAW
    .filter(d => isValidOccurrence(d[0], d[1]))
    .map(d => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [d[0], d[1]] },
      properties: { intensity: 0.7, species: 'Marsilea quadrifolia' }
    }))
};

async function loadEcoFC() {
  try {
    const resp = await fetch('./clover_map_data.geojson', { cache: 'force-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw  = await resp.json();
    const clean = (raw.features || []).filter(f => {
      const c = f?.geometry?.coordinates;
      return c && isValidOccurrence(c[0], c[1]);
    });
    const fc = {
      type: 'FeatureCollection',
      features: clean.map(f => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: f.geometry.coordinates },
        properties: {
          intensity: 0.7,
          species: f.properties?.species || f.properties?.scientificName || 'Marsilea quadrifolia'
        }
      }))
    };
    const sp  = fc.features[0]?.properties?.species || 'Marsilea quadrifolia';
    const badge = document.getElementById('eco-badge');
    if (badge) badge.innerHTML =
      `<span>Ecological archive · GBIF occurrence data</span>
       <span>${sp} · ${fc.features.length.toLocaleString()} records</span>`;
    return fc;
  } catch {
    const badge = document.getElementById('eco-badge');
    if (badge) badge.innerHTML =
      `<span>Ecological archive · GBIF occurrence data</span>
       <span>Marsilea quadrifolia · ${FALLBACK_FC.features.length} records · worldwide</span>`;
    return FALLBACK_FC;
  }
}

    cluster: true,
    clusterMaxZoom: 10,
    clusterRadius: 45,

  function makeCloverCanvas(size, alpha) {
    const c   = document.createElement('canvas');
    c.width   = c.height = size;
    const ctx = c.getContext('2d');
    const cx  = size / 2, cy = size / 2;
    const ps  = size * 0.255;

    [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2].forEach(angle => {
      const gcx = cx + Math.sin(angle) * size * 0.30;
      const gcy = cy - Math.cos(angle) * size * 0.30;
      const grad = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, size * 0.45);
      grad.addColorStop(0,    `rgba(212, 238, 198, ${alpha})`);
      grad.addColorStop(0.50, `rgba(186, 220, 168, ${alpha * 0.92})`);
      grad.addColorStop(1.00, `rgba(158, 200, 138, ${alpha * 0.76})`);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.scale(ps, ps);
      ctx.translate(0, -0.52);

      ctx.beginPath();
      ctx.moveTo(0, 0.56);
      ctx.bezierCurveTo( 0.85,  0.42,  1.02, -0.18,  0.50, -0.54);
      ctx.bezierCurveTo( 0.10, -0.92,  0,    -0.70,  0,    -0.30);
      ctx.bezierCurveTo( 0,    -0.70, -0.10, -0.92, -0.50, -0.54);
      ctx.bezierCurveTo(-1.02, -0.18, -0.85,  0.42,  0,     0.56);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    });

    return c;
  }
  window.makeCloverCanvas = makeCloverCanvas;

  function canvasToSpec(c) {
    const ctx = c.getContext('2d');
    const id  = ctx.getImageData(0, 0, c.width, c.height);
    return { width: c.width, height: c.height, data: id.data };
  }

  map.addImage('eco-clover-sm',  canvasToSpec(makeCloverCanvas(36, 0.70)));
  map.addImage('eco-clover-md',  canvasToSpec(makeCloverCanvas(48, 0.74)));
  map.addImage('eco-clover-lg',  canvasToSpec(makeCloverCanvas(60, 0.78)));
  map.addImage('eco-clover-dot', canvasToSpec(makeCloverCanvas(18, 0.62)));

  function buildCloverIcon(srcImg, sz, alpha) {
    const pngC = document.createElement('canvas');
    pngC.width = pngC.height = sz;
    const p = pngC.getContext('2d');
    const ins = Math.round(sz * 0.06);
    p.drawImage(srcImg, ins, ins, sz - ins * 2, sz - ins * 2);

    const px = p.getImageData(0, 0, sz, sz);
    const d  = px.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const greenBias  = g - Math.max(r, b);
      const brightness = (r + g + b) / 765;
      if (greenBias < 5 && brightness > 0.91) {
        d[i + 3] = 0;
      } else if (greenBias < 16) {
        d[i + 3] = Math.round((greenBias / 16) * alpha * 255);
      } else {
        d[i + 3] = Math.round(alpha * 255);
      }
    }
    p.putImageData(px, 0, 0);

    const glowC = document.createElement('canvas');
    glowC.width = glowC.height = sz;
    const gl = glowC.getContext('2d');
    const blurPx = Math.max(2, Math.round(sz * 0.11));
    gl.filter = `blur(${blurPx}px)`;
    gl.drawImage(pngC, 0, 0);
    gl.filter = 'none';

    const out = document.createElement('canvas');
    out.width = out.height = sz;
    const f = out.getContext('2d');
    f.globalAlpha = 0.20;
    f.drawImage(glowC, 0, 0);
    f.globalAlpha = 1.0;
    f.drawImage(pngC, 0, 0);
    return out;
  }

  function applyPNGToImages(srcImg) {
    [['eco-clover-sm',36,0.76],['eco-clover-md',48,0.80],

  map.addLayer({

async function processGBIFZip(file) {
  if (!window.JSZip) throw new Error('JSZip not loaded');
  const zip = await JSZip.loadAsync(file);

  const occEntry = Object.values(zip.files).find(f =>
    !f.dir && /occurrence/i.test(f.name) && /\.(txt|csv|tsv)$/i.test(f.name)
  ) || Object.values(zip.files).find(f =>
    !f.dir && /occurrence/i.test(f.name)
  );
  if (!occEntry) throw new Error('No occurrence file found in zip');

  const text    = await occEntry.async('string');
  const lines   = text.split(/\r?\n/);
  const headers = lines[0].split('\t');

  const latIdx = headers.indexOf('decimalLatitude');
  const lngIdx = headers.indexOf('decimalLongitude');
  const spIdx  = headers.indexOf('species');
  if (latIdx < 0 || lngIdx < 0) throw new Error('Missing lat/lng columns in occurrence data');

  const features = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = lines[i].split('\t');
    const lat  = parseFloat(cols[latIdx]);
    const lng  = parseFloat(cols[lngIdx]);
    if (!isValidOccurrence(lng, lat)) continue;
    features.push({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [lng, lat] },
      properties: {
        intensity: 0.7,
        species: (spIdx >= 0 ? cols[spIdx] : '') || 'Marsilea quadrifolia',
      }
    });
  }

  let sampled = features;
  if (features.length > 10000) {
    const step = Math.ceil(features.length / 10000);
    sampled = features.filter((_, i) => i % step === 0);
  }
  return { type: 'FeatureCollection', features: sampled };
}

  _importBtn.textContent = '⟳ Loading…';
  _importBtn.style.pointerEvents = 'none';

  try {
    let fc;
    if (file.name.endsWith('.zip')) {
      fc = await processGBIFZip(file);
    } else {
      const raw  = await file.text();
      const data = JSON.parse(raw);
      if (Array.isArray(data)) {
        fc = {
          type: 'FeatureCollection',
          features: data
            .filter(d => isValidOccurrence(Array.isArray(d) ? d[0] : d.lng, Array.isArray(d) ? d[1] : d.lat))
            .map(d => ({
              type: 'Feature',
              geometry: { type: 'Point', coordinates: Array.isArray(d) ? [d[0], d[1]] : [d.lng, d.lat] },
              properties: { intensity: 0.7, species: d.species || 'Marsilea quadrifolia' }
            }))
        };
      } else {
        fc = toGBIF_FC(data.features || []);
      }
    }

    updateMapSource(fc);
    _importBtn.textContent = `✓ ${fc.features.length.toLocaleString()} records`;
    _importBtn.classList.add('loaded');

    _importBtn.textContent = '⚠ Load failed';
    _importBtn.style.pointerEvents = 'all';
    console.error('[GBIF import]', err);

  _importInput.value = '';
});

function Particles() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const ctx    = canvas.getContext('2d');
    const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
    resize();
    addEventListener('resize', resize);
    const pts = Array.from({ length: 48 }, () => ({
      x:  Math.random() * innerWidth,
      y:  Math.random() * innerHeight,
      r:  Math.random() * 1.1 + 0.28,
      vx: (Math.random() - .5) * .17,
      vy: (Math.random() - .5) * .17,
      a:  Math.random() * .17 + .04,
    }));
    let id;
    const tick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pts.forEach(p => {
        p.x = (p.x + p.vx + canvas.width)  % canvas.width;
        p.y = (p.y + p.vy + canvas.height) % canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(50,118,50,${p.a})`;
        ctx.fill();
      });
      id = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(id); removeEventListener('resize', resize); };
  }, []);
  return (
    <canvas
      ref={ref}
      style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:6 }}
    />
  );
}

  './image-from-rawpixel-id-25889416-jpeg-removebg-preview.png',
];

function _srng(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
const _rng = _srng(2025);

const FLOAT_OBJS = FLOAT_IMGS.map((src, i) => {
  const N = FLOAT_IMGS.length;
  const baseAngle = (i / N) * Math.PI * 2;
  const angJitter  = (_rng() - 0.5) * (Math.PI * 2 / N) * 1.3;
  const idleAngle  = baseAngle + angJitter;
  const idleR      = 27 + _rng() * 28;
  const idleX      = 50 + Math.cos(idleAngle) * idleR;
  const idleY      = 50 + Math.sin(idleAngle) * idleR * 0.82;
  const sizeVmin   = 7  + _rng() * 9;
  const rot0       = (_rng() - 0.5) * 60;
  const floatAmp   = 5  + _rng() * 11;
  const floatFreq  = 0.28 + _rng() * 0.44;
  const floatPhase = _rng() * Math.PI * 2;
  const floatRotAmp = 2 + _rng() * 5;
  const clusterIdx    = i % 8;
  const clusterSubIdx = Math.floor(i / 8);
  return { src, idleX, idleY, sizeVmin, rot0, floatAmp, floatFreq, floatPhase, floatRotAmp, clusterIdx, clusterSubIdx };
});

const SP_K  = 0.09;
const SP_D  = 0.82;
const SP_KR = 0.08;
const SP_DR = 0.80;
const CLUSTER_R = 230;

function HeroSection({ onGone }) {
  const [exiting, setExiting] = React.useState(false);
  const containerRef   = React.useRef(null);
  const elRefs         = React.useRef([]);
  const textRef        = React.useRef(null);
  const physRef        = React.useRef(null);
  const rafRef         = React.useRef(null);
  const mouseRef       = React.useRef({ x: -9999, y: -9999 });
  const wheelScrollRef = React.useRef(0);

  React.useEffect(() => {
    document.getElementById('map-wrap')?.classList.add('hero-mode');
    window.mapReady.then(() => {
      window.mapInstance?.jumpTo({ center: [-8, 52], zoom: 4.5 });
    });

    const W = window.innerWidth, H = window.innerHeight;

    physRef.current = FLOAT_OBJS.map(obj => ({
      x: (obj.idleX / 100) * W,
      y: (obj.idleY / 100) * H,
      vx: 0, vy: 0, rot: obj.rot0, vrot: 0,
    }));

    const onMouse = e => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
    window.addEventListener('mousemove', onMouse);

    const onWheel = e => {
      wheelScrollRef.current = Math.max(0, Math.min(H * 0.85, wheelScrollRef.current + e.deltaY * 0.65));
    };
    window.addEventListener('wheel', onWheel, { passive: true });

    const loop = now => {
      const t  = now / 1000;
      const W  = window.innerWidth, H = window.innerHeight;
      const cx = W / 2, cy = H / 2;
      const minDim  = Math.min(W, H);
      const scroll  = wheelScrollRef.current;
      const { x: mx, y: my } = mouseRef.current;
      const distToCenter = Math.hypot(mx - cx, my - cy);
      const magnetic = (distToCenter < 300) && (mx > 0);

      const clusterPts = Array.from({ length: 8 }, (_, ci) => {
        const angle = -Math.PI / 2 + (ci / 8) * Math.PI * 2;
        const r = CLUSTER_R + (ci % 2 === 0 ? 0 : 32);
        return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
      });

      const phys       = physRef.current;
      const scrollFade = Math.max(0, 1 - scroll / (H * 0.5));
      const scrollUp   = scroll * 0.42;

      phys.forEach((s, i) => {
        const obj = FLOAT_OBJS[i];
        let tx, ty, tRot;

        if (magnetic) {
          const cp       = clusterPts[obj.clusterIdx];
          const subAngle = (obj.clusterSubIdx / 4) * Math.PI * 2;
          const subR     = 20 + obj.clusterSubIdx * 20;
          tx   = cp.x + Math.cos(subAngle) * subR;
          ty   = cp.y + Math.sin(subAngle) * subR;
          tRot = obj.rot0 * 0.22 + obj.clusterIdx * 11 - 38;
        } else {
          const fsin = Math.sin(t * obj.floatFreq * Math.PI * 2 + obj.floatPhase);
          const fcos = Math.cos(t * obj.floatFreq * Math.PI * 2 * 0.61 + obj.floatPhase + 1.1);
          tx   = (obj.idleX / 100) * W + fsin * obj.floatAmp;
          ty   = (obj.idleY / 100) * H + fcos * obj.floatAmp * 0.68;
          tRot = obj.rot0 + fsin * obj.floatRotAmp;
        }

        s.vx   = s.vx   * SP_D  - SP_K  * (s.x   - tx);
        s.vy   = s.vy   * SP_D  - SP_K  * (s.y   - ty);
        s.vrot = s.vrot * SP_DR - SP_KR * (s.rot  - tRot);
        s.x   += s.vx;
        s.y   += s.vy;
        s.rot += s.vrot;

        const el = elRefs.current[i];
        if (el) {
          const sizePx = (obj.sizeVmin / 100) * minDim;
          const px = s.x - sizePx / 2;
          const py = s.y - sizePx / 2 - scrollUp;
          el.style.transform = `translate(${px.toFixed(1)}px,${py.toFixed(1)}px) rotate(${s.rot.toFixed(2)}deg)`;
          el.style.opacity   = (0.88 * scrollFade).toFixed(3);
        }
      });

      const txt = textRef.current;
      if (txt) {
        txt.style.transform = `translate(-50%, calc(-50% - ${(scroll * 0.55).toFixed(1)}px))`;
        txt.style.opacity   = Math.max(0, 1 - scroll / (H * 0.28)).toFixed(3);
      }

      rafRef.current = requestAnimationFrame(loop);
    };

    rafRef.current = requestAnimationFrame(loop);

    return () => {
      window.removeEventListener('mousemove', onMouse);
      window.removeEventListener('wheel', onWheel);
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  const handleEnter = () => {
    if (exiting) return;
    setExiting(true);
    cancelAnimationFrame(rafRef.current);
    document.getElementById('map-wrap')?.classList.remove('hero-mode');
    window.mapReady.then(() =>
      window.mapInstance?.flyTo({
        center: [12, 22], zoom: 1.72,
        duration: 2600, curve: 1.5, essential: true,
      })
    );
    setTimeout(onGone, 1200);
  };

  return (
    <div
      ref={containerRef}
      onClick={handleEnter}
      style={{
        position: 'fixed', inset: 0, zIndex: 100,
        background: '#f9f8f5',
        cursor: 'pointer',
        opacity: exiting ? 0 : 1,
        transform: exiting ? 'scale(1.05)' : 'scale(1)',
        transition: exiting
          ? 'opacity 1.2s cubic-bezier(0.22,1,0.36,1), transform 1.3s cubic-bezier(0.22,1,0.36,1)'
          : 'none',
        pointerEvents: exiting ? 'none' : 'all',
        overflow: 'hidden',
        userSelect: 'none',
      }}
    >
      {FLOAT_OBJS.map((obj, i) => (
        <div
          key={i}
          ref={el => elRefs.current[i] = el}
          style={{
            position: 'absolute',
            top: 0, left: 0,
            width:  `${obj.sizeVmin}vmin`,
            height: `${obj.sizeVmin}vmin`,
            willChange: 'transform, opacity',
            pointerEvents: 'none',
          }}
        >
          <img
            src={obj.src}
            alt=""
            draggable="false"
            style={{ width:'100%', height:'100%', objectFit:'contain', display:'block' }}
          />
        </div>
      ))}

      <div style={{
        position:'absolute', inset:0, pointerEvents:'none', zIndex:5,
        background:'radial-gradient(ellipse 46% 48% at 50% 50%, transparent 0%, rgba(249,248,245,0.68) 100%)',
      }}/>

      <div
        ref={textRef}
        style={{
          position: 'absolute', zIndex: 10,
          top: '50%', left: '50%',
          transform: 'translate(-50%, -50%)',
          textAlign: 'center',
          pointerEvents: 'none',
          willChange: 'transform, opacity',
        }}
      >
        <h1 style={{
          margin: 0,
          fontFamily: '"Cormorant Garamond", "Cormorant", serif',
          fontWeight: 300,
          fontSize: 'clamp(1.9rem, 4.2vw, 3.4rem)',
          letterSpacing: '0.12em',
          color: '#1c2a14',
          lineHeight: 1.12,
          animation: 'heroFadeUp 1.3s 0.35s both',
        }}>Lucky Clover · World Map</h1>

        <p style={{
          margin: '1.5rem 0 0',
          fontFamily: '"Cormorant Garamond", serif',
          fontStyle: 'italic',
          fontWeight: 300,
          fontSize: 'clamp(0.6rem, 1.1vw, 0.85rem)',
          letterSpacing: '0.30em',
          textTransform: 'uppercase',
          color: 'rgba(72,108,54,0.48)',
          animation: 'heroFadeUp 1s 0.80s both',
        }}>click anywhere to begin</p>
      </div>
    </div>
  );
}

function App() {
  const [markers,      setMarkers]      = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('clover-v3') || 'null');
      if (!saved || !Array.isArray(saved)) return SAMPLES;
      if (saved.length && saved[0].svgX !== undefined) return SAMPLES;
      return saved.filter(m => m.id && typeof m.id === 'number') || SAMPLES;
    } catch { return SAMPLES; }
  });
  const [heroGone,     setHeroGone]     = useState(false);
  const [pendingPos,   setPendingPos]   = useState(null);
  const [showUpload,   setShowUpload]   = useState(false);
  const [activeMarker, setActiveMarker] = useState(null);
  const mapDots = useRef({});

  useEffect(() => {
    localStorage.setItem('clover-v3', JSON.stringify(markers));
  }, [markers]);

  const makeDotEl = useCallback((data, fresh = false) => {
    const el = document.createElement('div');
    el.className = `clover-dot${fresh ? ' clover-dot--fresh' : ''}`;

    if (window.cloverPNGCanvas) {
      const clone = document.createElement('canvas');
      clone.width = clone.height = 26;
      clone.getContext('2d').drawImage(window.cloverPNGCanvas, 0, 0);
      el.appendChild(clone);
    } else if (typeof window.makeCloverCanvas === 'function') {
      el.appendChild(window.makeCloverCanvas(26, 0.86));
    }

    el.title = data.location || '';
    el.addEventListener('click', () => {
      window.suppressNextMapClick?.();
      setActiveMarker(data);
    });
    return el;
  }, []);

  const placeDot = useCallback((data, fresh = false) => {
    if (mapDots.current[data.id]) mapDots.current[data.id].remove();
    const el = makeDotEl(data, fresh);
    const dot = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([data.lon, data.lat])
      .addTo(window.mapInstance);
    mapDots.current[data.id] = dot;
  }, [makeDotEl]);

  useEffect(() => {
    window.mapReady.then(() => {
      markers.forEach(m => placeDot(m, false));
      window.onMapClick = (lng, lat) => {
        setPendingPos({ lng, lat });
        setShowUpload(true);
      };
    });
    return () => { window.onMapClick = null; };
  }, []);

  const handleAdd = useCallback(({ preview, location, note }) => {
    if (!pendingPos) return;
    const m = {
      id: Date.now(),
      lat: +pendingPos.lat.toFixed(5),
      lon: +pendingPos.lng.toFixed(5),
      preview, location, note,
      ts: Date.now(),
    };
    setMarkers(prev => [...prev, m]);
    window.mapReady.then(() => placeDot(m, true));
    setPendingPos(null);
  }, [pendingPos, placeDot]);

  const zoomIn  = () => window.mapInstance?.zoomIn({ duration: 280 });
  const zoomOut = () => window.mapInstance?.zoomOut({ duration: 280 });
  const home    = () => window.mapInstance?.flyTo({ center:[12,22], zoom:1.72, duration:700 });

  return (
    <>
      {!heroGone && (
        <HeroSection onGone={() => {
          setHeroGone(true);
          ['eco-badge','data-import','eco-toggle'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.style.transition = 'opacity 0.9s 0.25s ease'; el.style.opacity = '1'; }
          });
        }} />
      )}

      <Particles/>

      <div style={{
        position:'fixed', inset:0, zIndex:7, pointerEvents:'none',
        background:'radial-gradient(ellipse 90% 88% at 50% 50%, transparent 52%, rgba(224,234,222,0.38) 100%)',
      }}/>

      <div style={{
        opacity: heroGone ? 1 : 0,
        transition: heroGone ? 'opacity 0.9s 0.2s ease' : 'none',
        pointerEvents: 'none',
      }}>

        <header style={{
          position:'fixed', top:0, left:0, right:0, zIndex:8,
          padding:'2.2rem 2rem 4rem', textAlign:'center',
          pointerEvents:'none',
          background:'linear-gradient(to bottom, rgba(247,249,244,0.9) 0%, rgba(247,249,244,0) 100%)',
        }}>
          <p
            className="anim-fade-up"
            style={{ fontFamily:'"Cormorant Garamond", serif', fontSize:'0.57rem', letterSpacing:'0.3em', textTransform:'uppercase', color:'#6a9a6a', marginBottom:'0.55rem', opacity:0, animationDelay:'0.1s' }}
          >
            A World of Lucky Moments
          </p>
          <h1
            className="anim-fade-up"
            style={{ fontFamily:'"Cormorant", "Cormorant Garamond", serif', fontWeight:300, fontSize:'clamp(1.55rem, 2.8vw, 2.6rem)', color:'#1a3a1a', letterSpacing:'0.07em', lineHeight:1.15, opacity:0, animationDelay:'0.3s' }}
          >
            Lucky Clover&nbsp;<em style={{ color:'#5aaa5a', fontStyle:'italic', fontWeight:300 }}>·</em>&nbsp;World Map
          </h1>
          <p
            className="anim-fade-up"
            style={{ fontFamily:'"Cormorant Garamond", serif', fontSize:'0.84rem', fontStyle:'italic', color:'#9abaaa', marginTop:'0.55rem', letterSpacing:'0.03em', opacity:0, animationDelay:'0.55s' }}
          >
            Click anywhere on the map to mark where you found yours
          </p>
        </header>

        <div style={{ position:'fixed', bottom:'2.4rem', right:'2rem', zIndex:12, display:'flex', flexDirection:'column', gap:'5px', pointerEvents: heroGone ? 'all' : 'none' }}>
          <ZBtn ch="+" action={zoomIn}/>
          <ZBtn ch="⊙" action={home}/>
          <ZBtn ch="−" action={zoomOut}/>
        </div>

        <div style={{
          position:'fixed', bottom:'2.6rem', left:'2rem', zIndex:12,
          fontFamily:'"Cormorant Garamond", serif',
          fontSize:'0.62rem', letterSpacing:'0.2em', textTransform:'uppercase', color:'#9abaaa',
          pointerEvents:'none',
        }}>
          {markers.length}&nbsp;{markers.length === 1 ? 'clover' : 'clovers'}&nbsp;found worldwide
        </div>

        <footer style={{
          position:'fixed', bottom:0, left:0, right:0, zIndex:5,
          padding:'0.6rem', textAlign:'center', pointerEvents:'none',
          background:'linear-gradient(to top, rgba(247,249,244,0.65) 0%, transparent 100%)',
        }}>
          <p style={{ fontFamily:'"Cormorant Garamond", serif', fontSize:'0.54rem', color:'#b8c8b8', letterSpacing:'0.16em' }}>
            Click to record a finding &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Drag to explore
          </p>
        </footer>

      </div>

      {showUpload && (
        <UploadModal
          onClose={() => { setShowUpload(false); setPendingPos(null); }}
          onSubmit={handleAdd}
        />
      )}
      {activeMarker && (
        <DetailPanel marker={activeMarker} onClose={() => setActiveMarker(null)}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
